events {
  worker_connections 4096;
}

http {
  upstream gateway_cluster {
    server gateway-1:3000;
    server gateway-2:3000;
    server gateway-3:3000;

    keepalive 64;              # keep 64 idle connections per worker open to the gateways
  }

  server {
    listen 80;

    location / {
      proxy_pass http://gateway_cluster;

      proxy_http_version 1.1;          # keepalive requires HTTP/1.1
      proxy_set_header Connection "";  # clear the Connection header so it doesn't force "close"

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}